<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alpha Dental</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, system-ui, sans-serif; background: #fff; color: #0f172a; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #64748b; line-height: 1.5; }
    button { font: inherit; font-weight: 700; padding: 14px 28px; border: 0; border-radius: 14px; background: #0ea5e9; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Alpha Dental</h1>
    <p>The clinic system could not be reached.<br>Check the connection and try again.<br><span dir="rtl">تعذر الوصول إلى النظام. تأكد من الاتصال وحاول مرة أخرى.</span></p>
    <button onclick="location.href='https://alphadental.app/'">Try again · إعادة المحاولة</button>
  </main>
</body>
</html>
